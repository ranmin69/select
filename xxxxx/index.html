<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .xx{
            width: 300px;
            height: 100px;
            line-height: 100px;
            text-align: center;
            border: solid 1px orangered;
            border-radius: 10px;
        }
        .oo{
            padding: 5px;
            background: palegreen;
            display: inline-block;
            border-radius: 5px;
            margin-top: 3px;
        }
        .uu{
            width: 200px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            background: #666666;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 5px solid red;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div>生成图片</div>
<div id="capture" style="padding: 10px; background: #f5da55">
    <h4 style="color: #000; ">Hello world!</h4>
    <div class="xx">javascript</div>
    <div class="oo">harmonyOS</div>
    <div class="uu">openHarmony</div>
</div>

<div>图片展示：</div>
<div class="img" style="margin-top: 10px;"></div>

<a href="" class="download" download="image">下载</a>
</body>
<script src="canvas.js"></script>
<script>
    html2canvas(document.querySelector("#capture")).then((res) => {
        // document.body.appendChild(res);
        const image = new Image();
        const src = res.toDataURL("image/png");
        image.src = src;
        document.querySelector('.img').append(image);
        const download = document.querySelector('.download');
        download.href = src;
    });
</script>
</html>
